<html lang="en" dir="ltr">
  <head>
    <link rel="icon" href="/images/logo/1v1-lol.png" sizes="32x32">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>1v1.lol</title>
    <meta name="description" content="Play 1v1.lol, a fast-paced online building and shooting game! Practice your aim and build skills in competitive multiplayer battles.">

    <!-- OpenGraph and Twitter -->
    <meta property="og:url" content="https://slopeonline.online/1v1-lol.embed" />
    <meta property="og:image" content="/images/logo/1v1-lol.jpg">
    <meta property="og:title" content="1v1.lol" />
    <meta property="og:site_name" content="1v1.lol" />
    <meta property="og:description" content="Play 1v1.lol, a fast-paced online building and shooting game!" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:site" content="@gameunblock" />
    <meta name="twitter:title" content="1v1.lol" />
    <meta name="twitter:description" content="Play 1v1.lol, a fast-paced online building and shooting game!" />
    <meta name="twitter:image" content="/images/logo/1v1-lol.jpg" />

    <!-- Styles -->
    <link rel="stylesheet" href="../css/bootstrap.min.css" />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css" />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="shortcut icon" href="/images/favicon.png" />

    <!-- Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-K35HNZRNN2"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-K35HNZRNN2');
    </script>

    <!-- WG Ad Tag -->
    <script type="text/javascript" async>
      !function(e,t){
        var a = e.createElement("script"),
            m = e.getElementsByTagName("script")[0];
        a.async = 1;
        a.src = "https://universal.wgplayer.com/tag/?lh=play.wgplayground.com&wp=/game/testing-environment/&ws=";
        m.parentNode.insertBefore(a,m);
      }(document);
    </script>
  </head>

  <body id="page-top" style="background: url('../images/background1.png'); background-size: cover;">
    <nav class="navbar navbar-expand-lg navbar-dark top-nav" id="mainNav"></nav>

    <div class="container">
      <div class="row">
        <div class="col-md-10">
          <div class="game-container">
            <div class="game-content">
              <div class="game-iframe-container" id="game-player">
                <div id="mobile-back-button" draggable="true">
                  <i class="bi bi-x-circle-fill"></i>
                </div>

                <!-- Game iframe: hidden by default -->
                <iframe class="game-iframe" id="game-area" style="display: none;" width="480" height="800" scrolling="none" frameborder="0" allowfullscreen></iframe>

                <!-- Loading/Ad message -->
                <div id="loading-ad-message" style="text-align:center; padding:20px; font-weight:bold;">
                  Loading ad... Please wait to unlock the game.
                </div>
              </div>
            </div>

            <div class="game-info">
              <div class="header-left">
                <h1 class="single-title">1v1.LOL</h1>
              </div>
              <div class="header-right">
                <div class="b-action2">
                  <a href="#" onclick="open_fullscreen()" class="btn btn-capsule">
                    <i class="bi bi-arrows-fullscreen b-icon"></i>Fullscreen
                  </a>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Right column for ads or blank -->
        <div class="col-md-2">
          <div align="center">
            <!-- ads can be placed here -->
          </div>
        </div>
      </div>
    </div>

    <div class="footer-copyright py-4" id="load_footer"></div>

    <!-- JS Scripts -->
    <script src="../js/jquery-3.6.2.min.js"></script>
    <script src="../js/bootstrap.min.js"></script>
    <script>
      $(function() {
        $("#mainNav").load("/layout/nav.html");
        $("#load_footer").load("/layout/footer.html");
      });

      // Ad logic
      function OnReadyMethod() {
        console.log("Rewarded ad is ready.");
        window[window.preroll.config.loaderObjectName].showRewardAd();
      }

      function OnSuccessMethod() {
        console.log("Ad watched. Loading game...");
        document.getElementById("loading-ad-message").style.display = "none";
        const iframe = document.getElementById("game-area");
        iframe.src = "https://snow-rider-3d.io/game/1v1-lol-3/";
        iframe.style.display = "block";
      }

      function OnFailMethod() {
        console.log("Ad was skipped or failed.");
        document.getElementById("loading-ad-message").innerText = "You must watch the ad to play the game.";
      }

      window.addEventListener("load", function () {
        let retries = 0;
        function tryRegister() {
          if (window.preroll?.config?.loaderObjectName) {
            window[window.preroll.config.loaderObjectName].registerRewardCallbacks({
              onReady: OnReadyMethod,
              onSuccess: OnSuccessMethod,
              onFail: OnFailMethod
            });
          } else if (retries < 10) {
            retries++;
            setTimeout(tryRegister, 500);
          } else {
            document.getElementById("loading-ad-message").innerText = "Ad failed to load. Try refreshing the page.";
          }
        }
        tryRegister();
      });
    </script>
  </body>
</html>
