    <script>
      $(function() {
        $("#mainNav").load("/layout/nav.html");
        $("#load_footer").load("/layout/footer.html");
      });

      // Rewarded Ad Callbacks
      function OnReadyMethod() {
        document.getElementById("ad-status").innerText = "Ad ready... showing now.";
        window[window.preroll.config.loaderObjectName].showRewardAd();
      }

      function OnSuccessMethod() {
        document.getElementById("ad-status").style.display = "none";
        const iframe = document.getElementById("game-area");
        iframe.src = "https://snow-rider-3d.io/game/1v1-lol-3/";
        iframe.style.display = "block";
      }

      function OnFailMethod() {
        document.getElementById("ad-status").innerText = "You must watch the ad to play the game.";
      }

      // Wait for WG loader, then register reward callbacks
      window.addEventListener("load", function () {
        let attempts = 0;
        function tryRegister() {
          const loader = window?.preroll?.config?.loaderObjectName;
          if (loader && window[loader]) {
            window[loader].registerRewardCallbacks({
              onReady: OnReadyMethod,
              onSuccess: OnSuccessMethod,
              onFail: OnFailMethod
            });
          } else if (attempts++ < 15) {
            setTimeout(tryRegister, 500);
          } else {
            document.getElementById("ad-status").innerText = "Ad failed to load. Try refreshing.";
          }
        }
        tryRegister();
      });
    </script>
